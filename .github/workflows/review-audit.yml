name: Source and review audit

# Fork policy: source/render failures block; stale independent reviews are
# explicitly reported. Historical source hashes and thread IDs are never
# rewritten to imply a new review. Strict independent-review mode is opt-in.

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/review-audit.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/review-audit.yml'
  workflow_dispatch:
    inputs:
      strict_reviews:
        description: "Require a fresh independent review for every current source"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: review-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install CPU-only PyTorch
        run: python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Check runnable RoPE and bilingual snippets
        run: python -m unittest discover -s tests -v
      - name: Rebuild generated pages
        run: python tools/build_site.py
      - name: Check render fidelity and review provenance
        run: python tools/verify_reviews.py --mode "${{ inputs.strict_reviews && 'strict' || 'bootstrap' }}" --reproduce
